# fuzzel — launcher, replaces ulauncher.
# Bound to Alt+Space in niri/config.kdl.
#
# fuzzel has no @import mechanism, so switch-theme rewrites the [colors] block
# below in place (same approach as kitty.conf / starship.toml).
#
# REQUIRES fuzzel >= 1.11. Ubuntu 24.04 packages 1.9.2, which is too old:
# fuzzel aborts on the FIRST unknown key rather than warning and continuing, so
# one newer option takes the whole launcher down — and with it Alt+Space,
# Alt+V (clipboard) and Alt+Shift+Slash (niri-keys), which all shell out to it.
# install-deps.sh builds 1.12.0 into ~/.local/bin, which shadows the apt binary.
#
# Version-sensitive keys, all needing >= 1.11: anchor, y-margin, the [colors]
# entries prompt/placeholder/input/counter, and delete-line-forward (called
# plain `delete-line` in 1.9.2). switch-theme's [colors] writer emits four of
# these, so the two files have to agree on the target version.
#
# Not 1.13+: that bumped pixman to >= 0.46, and 24.04 ships 0.42, which would
# mean building pixman from source too. 1.12.0 needs nothing outside apt.

font=Inter:size=13
dpi-aware=no
prompt="  "
icon-theme=Yaru
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
terminal=kitty -e
layer=overlay
exit-on-keyboard-focus-loss=yes

# Spotlight-ish proportions: wide, centred, roomy rows.
width=46
lines=12
horizontal-pad=24
vertical-pad=20
inner-pad=10
line-height=26

anchor=center
y-margin=0

[border]
width=1
radius=12

[colors]
# THEME:START — rewritten by switch-theme
background=141b1eff
text=dadadaff
prompt=8a9291ff
placeholder=8a9291ff
input=dadadaff
match=6cbfbfff
selection=2d3437ff
selection-text=dadadaff
selection-match=6cbfbfff
counter=8a9291ff
border=2d3437ff
# THEME:END

[key-bindings]
# Ctrl-based bindings are safe here — fuzzel is not a terminal, zellij never
# sees these. Kept vim-ish anyway.
#
# Control+k defaults to delete-line-forward and Tab/ISO_Left_Tab default to
# execute-or-next / prev-with-wrap. A key can only carry one action, so the
# conflicting default has to be released with =none before it's reused.
# The action is `delete-line-forward` from 1.10.0 on; 1.9.2 called it plain
# `delete-line`. Getting the name wrong doesn't merely lose the rename —
# Control+k stays bound and `prev` then fails with "already mapped".
delete-line-forward=none
next=Down Control+j
prev=Up Control+k
